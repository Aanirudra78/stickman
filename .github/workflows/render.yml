name: Render video

# Phone-friendly pipeline: one click (or one API call) -> voice -> render ->
# a downloadable mp4 on the Releases page. No server, no card.
#
# Inputs come either from the GitHub UI or from `cloud/index.html`
# (workflow_dispatch API - that is what the one-button page uses).

on:
  workflow_dispatch:
    inputs:
      script_text:
        description: "Script text (blank = render the committed public/script.json)"
        required: false
        type: string
      title:
        description: "Video title (optional)"
        required: false
        default: ""
        type: string
      quality:
        description: "draft = 540x960 fast, final = 1080x1920"
        required: false
        default: "final"
        type: choice
        options:
          - final
          - draft
      provider:
        description: "Voice provider"
        required: false
        default: "elevenlabs"
        type: choice
        options:
          - elevenlabs
          - edge
      voice:
        description: "Voice id (blank = default voice)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: stickman-render
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Chrome libraries
        run: |
          sudo apt-get update
          # Ubuntu 24.04 renamed several libs (*t64). Try those names, fall back
          # to the legacy ones, and never fail: the runner image already ships
          # Chrome with its dependencies.
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64 libpango-1.0-0t64 libcairo2 \
          || sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2 \
          || echo "note: Chrome libraries already present, continuing"

      - name: Install dependencies
        run: |
          # ffmpeg-static downloads its binary in a postinstall script from a
          # GitHub release asset, which is unreliable (504s / rate limits).
          # Fall back to a script-free install and the runner's own ffmpeg.
          npm ci || {
            echo "npm ci failed - retrying without install scripts"
            npm ci --ignore-scripts
          }
          if [ ! -f node_modules/ffmpeg-static/ffmpeg ]; then
            if ! command -v ffmpeg >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
            fi
            echo "copying the runner's ffmpeg into ffmpeg-static"
            cp "$(command -v ffmpeg)" node_modules/ffmpeg-static/ffmpeg
            chmod +x node_modules/ffmpeg-static/ffmpeg
          fi
          node_modules/ffmpeg-static/ffmpeg -version | head -n 1

      - name: Prepare browser
        run: npx remotion browser ensure

      - name: Prepare script
        env:
          SCRIPT_TEXT: ${{ inputs.script_text }}
          SCRIPT_TITLE: ${{ inputs.title }}
          VOICE: ${{ inputs.voice }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          if [ -n "$SCRIPT_TEXT" ]; then
            node studio/split.mjs --text-env=SCRIPT_TEXT --out=.studio-script.json \
              --title="$SCRIPT_TITLE" --voice="$VOICE" --provider="$PROVIDER"
            node scripts/apply-script.mjs .studio-script.json
          else
            echo "no script_text - using the committed public/script.json"
            VOICE="$VOICE" node scripts/apply-script.mjs
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Detection checks
        run: npm run test:detect

      - name: Generate voiceover
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: npm run voiceover

      - name: Render
        run: |
          if [ "${{ inputs.quality }}" = "draft" ]; then
            npx remotion render StickmanExplainer out/video.mp4 --log=error --scale=0.5
          else
            npx remotion render StickmanExplainer out/video.mp4 --log=error
          fi

      - name: Visual + audio QA
        id: qa
        env:
          FROZEN_MOTION: "0.6"
          GUEST_ENTER_MAB: "4"
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          node scripts/build-timings.mjs out/timings.json

          probe_exit=0
          node scripts/probe-draft.mjs out/video.mp4 out/timings.json --json > out/qa.json \
            || probe_exit=$?
          if [ -f out/qa.json ]; then
            node -e "
              let qa;
              try { qa = require('./out/qa.json'); } catch { process.exit(0); }
              const rows = qa.rows || [];
              console.log('### QA: every scene must move, guests must appear');
              console.log('scene | motion | state');
              console.log('---|---|---');
              rows.forEach((r) => console.log('| ' + r.scene + ' | ' + (r.motion ?? 'still') + ' | ' + r.state + ' |'));
              (qa.guests || []).forEach((g) => console.log('guest scene ' + g.scene + ' ' + g.name +
                ': enter ' + g.enterMab + (g.appeared ? '' : ' -> FAILED')));
            " >> "$GITHUB_STEP_SUMMARY" || true
          fi
          cat out/qa.json

          audio_exit=0
          node scripts/check-rendered-audio.mjs out/video.mp4 2>&1 \
            | tee out/audio-check.txt >> "$GITHUB_STEP_SUMMARY" || audio_exit=$?

          if [ "$probe_exit" -ne 0 ] || [ "$audio_exit" -ne 0 ]; then
            echo "QA failed: probe=$probe_exit audio=$audio_exit"
            exit 1
          fi

      - name: Fit upload limit
        id: fit
        run: node scripts/compress-if-needed.mjs out/video.mp4 --max-mb=45

      - name: Publish download
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ steps.fit.outputs.out }}
          TITLE: ${{ inputs.title }}
        run: |
          ASSET="stickman-${{ github.run_number }}.mp4"
          cp "$FILE" "$ASSET"
          TAG="render-${{ github.run_number }}"
          gh release create "$TAG" "$ASSET" \
            --title "${TITLE:-Stickman video #${{ github.run_number }}}" \
            --notes "Auto-rendered by Stickman Studio." \
            --latest=false
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload QA artifacts
        if: failure() && hashFiles('out/qa.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ github.run_number }}
          path: |
            out/qa.json
            out/audio-check.txt
            out/timings.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: success()
        run: |
          {
            echo "### Video ready"
            echo ""
            echo "- Release: \`${{ steps.release.outputs.tag }}\`"
            echo "- Asset: \`${{ steps.release.outputs.asset }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failure summary
        if: failure()
        run: echo "Render failed - open the step log above." >> "$GITHUB_STEP_SUMMARY"
