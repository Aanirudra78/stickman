name: Render video

# Phone-friendly pipeline: one click (or one API call) -> voice -> render ->
# a downloadable mp4 on the Releases page. No server, no card.
#
# Inputs come either from the GitHub UI or from `cloud/index.html`
# (workflow_dispatch API - that is what the one-button page uses).

on:
  workflow_dispatch:
    inputs:
      script_text:
        description: "Script text (blank = render the committed public/script.json)"
        required: false
        type: string
      title:
        description: "Video title (optional)"
        required: false
        default: ""
        type: string
      quality:
        description: "draft = 540x960 fast, final = 1080x1920"
        required: false
        default: "final"
        type: choice
        options:
          - final
          - draft
      provider:
        description: "Voice provider"
        required: false
        default: "elevenlabs"
        type: choice
        options:
          - elevenlabs
          - edge
      voice:
        description: "Voice id (blank = default voice)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: stickman-render
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Chrome libraries
        run: |
          sudo apt-get update
          # Ubuntu 24.04 renamed several libs (*t64). Try those names, fall back
          # to the legacy ones, and never fail: the runner image already ships
          # Chrome with its dependencies.
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64 libpango-1.0-0t64 libcairo2 \
          || sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2 \
          || echo "note: Chrome libraries already present, continuing"

      - name: Install dependencies
        run: npm ci

      - name: Prepare browser
        run: npx remotion browser ensure

      - name: Prepare script
        env:
          SCRIPT_TEXT: ${{ inputs.script_text }}
          SCRIPT_TITLE: ${{ inputs.title }}
          VOICE: ${{ inputs.voice }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          if [ -n "$SCRIPT_TEXT" ]; then
            node studio/split.mjs --text-env=SCRIPT_TEXT --out=.studio-script.json \
              --title="$SCRIPT_TITLE" --voice="$VOICE" --provider="$PROVIDER"
            node scripts/apply-script.mjs .studio-script.json
          else
            echo "no script_text - using the committed public/script.json"
            VOICE="$VOICE" node scripts/apply-script.mjs
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate voiceover
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: npm run voiceover

      - name: Render
        run: |
          if [ "${{ inputs.quality }}" = "draft" ]; then
            npx remotion render StickmanExplainer out/video.mp4 --log=error --scale=0.5
          else
            npx remotion render StickmanExplainer out/video.mp4 --log=error
          fi

      - name: Fit upload limit
        id: fit
        run: node scripts/compress-if-needed.mjs out/video.mp4 --max-mb=45

      - name: Publish download
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ steps.fit.outputs.out }}
          TITLE: ${{ inputs.title }}
        run: |
          ASSET="stickman-${{ github.run_number }}.mp4"
          cp "$FILE" "$ASSET"
          TAG="render-${{ github.run_number }}"
          gh release create "$TAG" "$ASSET" \
            --title "${TITLE:-Stickman video #${{ github.run_number }}}" \
            --notes "Auto-rendered by Stickman Studio." \
            --latest=false
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: success()
        run: |
          {
            echo "### Video ready"
            echo ""
            echo "- Release: \`${{ steps.release.outputs.tag }}\`"
            echo "- Asset: \`${{ steps.release.outputs.asset }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failure summary
        if: failure()
        run: echo "Render failed - open the step log above." >> "$GITHUB_STEP_SUMMARY"
